# Builds the bot on every push to main: the build and tests, then fsb.exe for Windows (and the Mac and
# Linux builds) as the artifact fsb-builds of the run, to download and drop into place.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Build and test
        run: |
          go build ./...
          go test ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/windows/fsb.exe ./cmd/fsb
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o dist/mac-apple-silicon/fsb ./cmd/fsb
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/mac-intel/fsb ./cmd/fsb
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/linux-amd64/fsb ./cmd/fsb
          cp fsb.sample.env dist/
      - uses: actions/upload-artifact@v4
        with:
          name: fsb-builds
          path: dist
          retention-days: 30
          if-no-files-found: error
